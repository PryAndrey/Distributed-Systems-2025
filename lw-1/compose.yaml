version: "3.9"

services:
  valuator:
    image: valuator
    build:
      context: .
      dockerfile: Valuator/Dockerfile
    depends_on:
      redis-main:
        condition: service_healthy
      redis-ru:
        condition: service_healthy
      redis-eu:
        condition: service_healthy
      redis-asia:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      centrifugo:
        condition: service_started
    environment:
      - DB_MAIN=redis-main:6379,password=1234
      - DB_RU=redis-ru:6379,password=1234
      - DB_EU=redis-eu:6379,password=1234
      - DB_ASIA=redis-asia:6379,password=1234
      - REDIS_PASSWORD=1234
      - RABBITMQ_USER=appuser
      - RABBITMQ_PASS=1234

  rankcalculator:
    image: rankcalculator
    build:
      context: .
      dockerfile: RankCalculator/Dockerfile
    depends_on:
      redis-main:
        condition: service_healthy
      redis-ru:
        condition: service_healthy
      redis-eu:
        condition: service_healthy
      redis-asia:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      centrifugo:
        condition: service_started
    environment:
      - DB_MAIN=redis-main:6379,password=1234
      - DB_RU=redis-ru:6379,password=1234
      - DB_EU=redis-eu:6379,password=1234
      - DB_ASIA=redis-asia:6379,password=1234
      - REDIS_PASSWORD=1234
      - RABBITMQ_USER=appuser
      - RABBITMQ_PASS=1234

  eventslogger:
    image: eventslogger
    build:
      context: .
      dockerfile: EventsLogger/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - RABBITMQ_USER=appuser
      - RABBITMQ_PASS=1234

  redis-main:
    image: redis
    command: ["redis-server", "--requirepass", "1234"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "1234", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  redis-ru:
    image: redis
    command: ["redis-server", "--requirepass", "1234"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "1234", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6380:6379"

  redis-eu:
    image: redis
    command: ["redis-server", "--requirepass", "1234"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "1234", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6381:6379"

  redis-asia:
    image: redis
    command: ["redis-server", "--requirepass", "1234"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "1234", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6382:6379"

  rabbitmq:
    image: rabbitmq:management
    environment:
      RABBITMQ_DEFAULT_USER: appuser
      RABBITMQ_DEFAULT_PASS: 1234
    ports:
      - "15672:15672"
      - "5672:5672"
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  centrifugo:
    image: centrifugo/centrifugo:v5
    volumes:
      - ./centrifugo/config.json:/centrifugo/config.json
    command: centrifugo -c config.json
    ports:
      - "8000:8000"

  nginx:
    image: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - valuator
      - rankcalculator

volumes:
  redis-main-data:
  redis-ru-data:
  redis-eu-data:
  redis-asia-data:
  rabbitmq-data: